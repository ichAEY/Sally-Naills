name: Deploy Sally Nails TANEM site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          path: customer

      - name: Check content
        id: ready
        shell: bash
        run: |
          READY=true
          MASTER=$(find customer/assets/images -maxdepth 1 -type f \( -iname 'master.jpg' -o -iname 'master.jpeg' -o -iname 'master.png' -o -iname 'master.webp' \) | wc -l | tr -d ' ')
          PORTFOLIO=$(find customer/assets/images/portfolio -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l | tr -d ' ')
          [ "$MASTER" -ge 1 ] || READY=false
          [ "$PORTFOLIO" -ge 5 ] || READY=false
          node --input-type=module -e "import('./customer/site-data.mjs').then(({default:s}) => process.exit(s?.master?.name && s?.links?.bookingUrl ? 0 : 1))" || READY=false
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Checkout visual base
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ichAEY/claytone-current
          ref: ce1bd42b44e76e1851af9e069c4cbcf06fc8eac2
          path: template

      - name: Checkout TANEM factory
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ichAEY/tanem-master-template-v1
          ref: 2c3590bdb8d4163532d126d67f27be1469a426c5
          path: factory

      - name: Stage client and factory
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          cp customer/site-data.mjs template/site-data.mjs
          mkdir -p template/public/assets/client/portfolio
          find customer/assets/images -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -exec cp {} template/public/assets/client/ \;
          find customer/assets/images/portfolio -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -exec cp {} template/public/assets/client/portfolio/ \;
          cp factory/scripts/apply-tanem-template.mjs template/scripts/tanem-template.mjs
          cp factory/scripts/apply-tanem-final.mjs template/scripts/tanem-final.mjs
          cp factory/scripts/apply-tanem-polish.mjs template/scripts/tanem-polish.mjs
          cp factory/scripts/apply-tanem-tuning.mjs template/scripts/tanem-tuning.mjs
          echo "SITE_BASE_PATH=" >> "$GITHUB_ENV"
          if [ -f customer/CNAME ]; then cp customer/CNAME template/public/CNAME; fi
          printf '%s\n' '// external booking link' > template/public/noop.js

      - name: Setup Node
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install
        if: steps.ready.outputs.ready == 'true'
        working-directory: template
        run: npm ci

      - name: Generate TANEM site
        if: steps.ready.outputs.ready == 'true'
        working-directory: template
        run: |
          node scripts/generate-site.mjs
          node scripts/tanem-template.mjs
          node scripts/tanem-final.mjs
          node scripts/tanem-polish.mjs
          node scripts/tanem-tuning.mjs

      - name: Configure GitHub Pages export
        if: steps.ready.outputs.ready == 'true'
        working-directory: template
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const basePath = process.env.SITE_BASE_PATH || "";
          const nextConfig: NextConfig = { output: "export", trailingSlash: true, images: { unoptimized: true }, basePath };
          export default nextConfig;
          EOF

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const prefix = process.env.SITE_BASE_PATH || '';
          const roots = ['app', 'public'];
          const allowed = new Set(['.tsx','.ts','.js','.mjs','.css','.html']);
          const replacements = [
            ['/assets/', `${prefix}/assets/`],
            ['/claytone-enhancements.js', `${prefix}/claytone-enhancements.js`],
            ['/android-scroll-fix.js', `${prefix}/android-scroll-fix.js`],
            ['/favicon.svg', `${prefix}/favicon.svg`],
            ['/noop.js', `${prefix}/noop.js`],
          ];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (allowed.has(path.extname(entry.name))) {
                let text = fs.readFileSync(full,'utf8');
                for (const [from,to] of replacements) text = text.split(from).join(to);
                fs.writeFileSync(full,text);
              }
            }
          }
          for (const root of roots) if (fs.existsSync(root)) walk(root);
          NODE

          rm -rf public/_next
          node - <<'NODE'
          const fs=require('fs'); const p='tsconfig.json'; const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.exclude=[...(c.exclude||[]),'db/**','worker/**','examples/**','build/**','drizzle/**','drizzle.config.ts','vite.config.ts'];
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE

      - name: Build
        if: steps.ready.outputs.ready == 'true'
        working-directory: template
        run: |
          npx next build
          test -s out/index.html
          test -s out/CNAME
          test -d out/_next

      - name: Setup Pages
        if: steps.ready.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: steps.ready.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: template/out

  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
