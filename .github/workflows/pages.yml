name: Deploy Sally Nails TANEM site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}

    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4
        with:
          path: customer

      - name: Check client content
        id: readiness
        shell: bash
        run: |
          set -e
          READY=true
          MASTER_COUNT=$(find customer/assets/images -maxdepth 1 -type f \( -iname 'master.jpg' -o -iname 'master.jpeg' -o -iname 'master.png' -o -iname 'master.webp' \) 2>/dev/null | wc -l | tr -d ' ')
          PORTFOLIO_COUNT=$(find customer/assets/images/portfolio -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) 2>/dev/null | wc -l | tr -d ' ')

          [ "$MASTER_COUNT" -ge 1 ] || READY=false
          [ "$PORTFOLIO_COUNT" -ge 5 ] || READY=false

          if ! node --input-type=module -e "import('./customer/site-data.mjs').then(({default:s}) => process.exit(s?.master?.name && s?.links?.bookingUrl ? 0 : 1))"; then
            READY=false
          fi

          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned visual base
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ichAEY/claytone-current
          ref: ce1bd42b44e76e1851af9e069c4cbcf06fc8eac2
          path: template

      - name: Checkout corrected TANEM factory
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ichAEY/tanem-master-template-v1
          ref: 15686ee22b0586b34fa1111e99774dd87b569378
          path: factory

      - name: Stage client data, assets and factory scripts
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          cp customer/site-data.mjs template/site-data.mjs
          mkdir -p template/public/assets/client/portfolio

          find customer/assets/images -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -exec cp {} template/public/assets/client/ \;
          find customer/assets/images/portfolio -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -exec cp {} template/public/assets/client/portfolio/ \;

          cp factory/scripts/apply-tanem-template.mjs template/scripts/tanem-template.mjs
          cp factory/scripts/apply-tanem-final.mjs template/scripts/tanem-final.mjs

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "SITE_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
          printf '%s\n' '// Booking uses the external client booking URL.' > template/public/noop.js

      - name: Setup Node
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install dependencies
        if: steps.readiness.outputs.ready == 'true'
        working-directory: template
        run: npm ci

      - name: Generate client site
        if: steps.readiness.outputs.ready == 'true'
        working-directory: template
        run: |
          node scripts/generate-site.mjs
          node scripts/tanem-template.mjs
          node scripts/tanem-final.mjs

      - name: Configure static export
        if: steps.readiness.outputs.ready == 'true'
        working-directory: template
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const basePath = process.env.SITE_BASE_PATH || "";
          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            images: { unoptimized: true },
            basePath,
          };
          export default nextConfig;
          EOF

      - name: Prefix project Pages asset URLs
        if: steps.readiness.outputs.ready == 'true'
        working-directory: template
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const prefix = process.env.SITE_BASE_PATH || '';
          const roots = ['app', 'public'];
          const allowed = new Set(['.tsx', '.ts', '.js', '.mjs', '.css', '.html']);
          const replacements = [
            ['/assets/', `${prefix}/assets/`],
            ['/claytone-enhancements.js', `${prefix}/claytone-enhancements.js`],
            ['/android-scroll-fix.js', `${prefix}/android-scroll-fix.js`],
            ['/favicon.svg', `${prefix}/favicon.svg`],
            ['/noop.js', `${prefix}/noop.js`],
          ];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (allowed.has(path.extname(entry.name))) {
                let text = fs.readFileSync(full, 'utf8');
                const before = text;
                for (const [from, to] of replacements) text = text.split(from).join(to);
                if (text !== before) fs.writeFileSync(full, text);
              }
            }
          }
          for (const root of roots) if (fs.existsSync(root)) walk(root);
          NODE

      - name: Prepare clean build
        if: steps.readiness.outputs.ready == 'true'
        working-directory: template
        run: |
          rm -rf public/_next
          node - <<'NODE'
          const fs = require('fs');
          const path = 'tsconfig.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.exclude = [
            ...(config.exclude || []),
            'db/**', 'worker/**', 'examples/**', 'build/**', 'drizzle/**',
            'drizzle.config.ts', 'vite.config.ts'
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build client site
        if: steps.readiness.outputs.ready == 'true'
        working-directory: template
        run: npx next build

      - name: Setup Pages
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: template/out

  deploy:
    if: needs.build.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
