name: Record Pages deployment status

on:
  workflow_run:
    workflows: ["Deploy Sally Nails TANEM site"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record final workflow result
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 - <<'PY'
          import json, os
          data = {
            "run_id": int(os.environ["RUN_ID"]),
            "run_number": int(os.environ["RUN_NUMBER"]),
            "conclusion": os.environ["CONCLUSION"],
            "head_sha": os.environ["HEAD_SHA"],
            "html_url": os.environ["HTML_URL"],
          }
          with open('deploy-status.json','w',encoding='utf-8') as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
          PY
          git config user.name "tanem-deploy-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-status.json
          git commit -m "Record Pages deployment status" || exit 0
          git pull --rebase
          git push
